  <script>
    function searchGoogle() {
      const query = document.getElementById('search').value.trim();
      if (query) {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        return;
      }
      window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
    }

    const searchInput = document.getElementById("search");
    const searchButton = document.getElementById("search-button");

    searchInput.addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        searchButton.click();
      }
    });

    document.addEventListener("keypress", function(event) {
      if(event.key === "/" && !event.target.matches('input, textarea')) {
        event.preventDefault();
        searchInput.focus();
      }
    })

    function toggleMenu() {
      const menu = document.getElementById('menu-container');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }

    function handleMenuClick(idx) {
      const item = menuItems[idx];
      if (item && item.link) {
        window.location.href = item.link;
        return;
      } else {
        window.open(item.link, "_blank");
      }
    }

    function addMenuItem() {
      menuItems.push({ name: '', link: '' });
      renderEditForm();
    }

    function removeMenuItem() {
      if (menuItems.length > 0) {
        menuItems.pop();
        renderEditForm();
      }
    }

    // Edit items logic
    let menuItems = JSON.parse(localStorage.getItem('menuItems')) || [
    { name: 'Google', link: 'https://www.google.com' },
    { name: 'Youtube', link: 'https://www.youtube.com' },
    { name: 'Github', link: 'https://www.github.com' },
    { name: 'Netflix', link: 'https://www.netflix.com' },
    { name: 'Amazon', link: 'https://www.amazon.com' }
    ];

    function toggleEditMode() {
    const modal = document.getElementById('edit-items-modal');
    if (modal.style.display === 'none') {
      renderEditForm();
      modal.style.display = 'block';
    } else {
      modal.style.display = 'none';
    }
    }

    function renderEditForm() {
    const form = document.getElementById('edit-items-form');
    form.innerHTML = '';
    menuItems.forEach((item, idx) => {
      form.innerHTML += `
      <div style="margin-bottom:10px;">
        <label>Name: <input type="text" name="name${idx}" value="${item.name}" /></label>
        <label>Link: <input type="text" name="link${idx}" value="${item.link}" /></label>
      </div>
      `;
    });
    }

    function saveMenuItems() {
    const form = document.getElementById('edit-items-form');
    menuItems = menuItems.map((item, idx) => ({
      name: form[`name${idx}`].value,
      link: form[`link${idx}`].value
    }));
    localStorage.setItem('menuItems', JSON.stringify(menuItems));
    updateMenuList();
    toggleEditMode();
    }

    function updateMenuList() {
    const ul = document.getElementById('menu-list');
    ul.innerHTML = '';
    menuItems.forEach((item, idx) => {
      ul.innerHTML += `
      <li>
        <button type="button" onclick="handleMenuClick(${idx})">
        ${item.link ? `<a href="javascript:void(0);">${item.name}</a>` : item.name}
        </button>
      </li>
      `;
    });
    }

    // Initial render
    updateMenuList();
  </script>
